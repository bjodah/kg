# C-x b RET on a query that names no buffer closes the prompt having
# selected nothing, and the editor is usable immediately after.
#
# Sharing the picker with the Lisp `b` interactive code -- whose contract
# *is* to re-prompt on a miss -- gave C-x b that behaviour too, so RET
# reopened the prompt forever and every subsequent keystroke went into the
# query instead of the buffer.  The trailing "Z" is what proves the prompt
# actually closed: if it had not, "Z" would have been typed into the
# query and the buffer would still read "hello".
name: buffer-switch-nonmatching-query-dismisses
filename: switch-miss.txt
backend: tmux
initial: "hello"
keys:
  - C-x
  - C-f
  - "other.txt"
  - RET
  - C-x
  - b
  - "nosuchbuffer"
  - RET
  - C-x
  - b
  - "switch-miss"
  - RET
  - C-End
  - Z
expected_screen_not_contains:
  - "nosuchbuffer"
expected_saved: "helloZ"
