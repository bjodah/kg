# C-x C-f on a directory lists it instead of failing with "Is a directory".
#
# The path prompt is prefilled with the current file's directory (the case's
# temporary directory, which holds notes.txt), so "home/" names the case's
# HOME, where config_files plants the tree.  It carries a trailing slash
# because the bare token "home" is the harness's name for the Home key.
#
# C-b before RET is what makes the answer a directory: with point at the
# end of the line RET takes the picker's selection and descends into it
# instead of returning it, so leaving point short of the end submits the
# typed directory.  That is the behavior this case pins down; M-RET and an
# answer ending in "/." are the two direct ways to submit a directory
# (dired-open-meta-ret-prefill.yaml and dired-open-dot-answer.yaml), and
# dired-listing.yaml names a file inside the target instead, which only
# M-x dired accepts.
name: dired-open-file-directory
filename: notes.txt
backend: tmux
config_files:
  a.txt: alpha
  sub/keep.txt: kept
initial: |
  notes
keys:
  - C-x
  - C-f
  - "home/"
  - C-b
  - RET
# q leaves dired for notes.txt before the trailer saves; saving from the
# read-only dired buffer would prompt for a filename instead.
trailer_keys: [q, C-x, C-s, C-x, C-c]
expected_saved: |
  notes
expected_screen_contains:
  - "(Dired RO)"
  - "/home:"
  - "  a.txt"
  - "  sub/"
  - "2 entries"
