name: lsp-rust-analyzer-definition
# M-. against the real rust-analyzer, not the fake server: no `env:` here,
# so kg spawns the `rust-analyzer` on PATH exactly as a user would get it,
# and `requires_tool: rust-analyzer` makes a box without one SKIP with a
# printed reason (`--require-tools` turns that into an upfront FAIL).
#
# The fixture is what makes the workspace root real rather than incidental:
# `workspace_files:` plants a Cargo.toml beside the file under test, which
# is the marker lsp_workspace_root() looks for, so rust-analyzer is started
# in the case's own temporary directory and the `cargo metadata` it runs
# there describes the file kg is asking about.  The manifest names the
# target's path explicitly because the file under test lives beside
# Cargo.toml rather than in the src/ layout cargo assumes, and a file
# rust-analyzer cannot place in the crate graph is answered "no definition
# found" at every position in it.
#
# The jump asserted here is within main.rs, because the assertion is the
# saved file and kg saves the buffer it is in.
#
# Point is walked to the reference rather than searched to it: three Down
# and four C-f put it on the "l" of the indented `local_target(1)`, and an
# identifier's first byte is a position rust-analyzer resolves without
# argument.
#
# The M-. is asked REPEATEDLY and that is the case, not a wart.  Servers
# are started lazily, so the first one is what spawns rust-analyzer -- and
# rust-analyzer does not queue a request it cannot answer yet: it replies
# immediately, with an empty result, until `cargo metadata` has run, the
# sysroot is loaded and the crate graph exists.  Measured by hand on this
# box against a warm cargo cache, a definition request at that position
# answered `[]` at 0.02 s, `null` at 0.6 s and the real Location at 1.7 s.
# So an early M-. buys the server and says "No definition found", and the
# question this case is about is whichever M-. is the first one asked after
# the graph exists -- which is why there is a round of them rather than a
# guess at when that is.  clangd needs none of this
# (lsp-clangd-definition.yaml asks once, cold, deliberately) because parsing
# one translation unit is all the answer depends on.
#
# A server that answers `[]` instead of waiting cannot be waited out, so
# the question is ASKED again rather than waited on longer: five rounds of
# M-. followed by `SETTLE=<budget>:(1,3)`, with the budgets escalating
# 4, 8, 16, 32, 64.  A SETTLE is a budget and not a sleep -- the harness
# polls the pane until the mode line reads the definition's position, which
# is on screen only once the answer has been applied, the mode line reading
# `(4,4)` until then -- so a round that lands ends the wait immediately and
# every later round is free: its SETTLE sees `(1,3)` already there, and
# re-asking at the declaration point returns that same location, leaving
# point where it is.  Only the rounds that ask too early cost their budget,
# and the escalation is what keeps the fast box cheap (the crate graph is
# up at 1.7 s here, so round two answers, ~5 s in total) while still
# covering a box that needs two minutes: the last round is asked at t=60 s
# and waits until t=124 s.  That tail is not decoration.  The first, page
# -cache-cold run of this case on the three-core CI box did not answer
# within 64 s, and the second run of the same binary on the same box
# answered well inside it -- so the budget that matters is the one the
# first run of the day needs, not the one the rest of them do.
#
# What this replaced was ~7.2 s of repaints for the load and ~3.0 s for the
# answer, four times the 1.7 s measured here -- and not enough on the CI
# box, three cores against thirty-two, where it failed with the box
# otherwise IDLE.  A fixed sleep cannot be sized for both boxes at once.
# Reading a pane needs one to read, which is why this case is
# `backend: tmux` (a box without tmux SKIPs it, the same way a box without
# rust-analyzer does) and why it no longer carries a key_delay: the delay
# used to BE the wait.
requires_feature: lsp
requires_tool: rust-analyzer
backend: tmux
filename: main.rs
workspace_files:
  Cargo.toml: |
    [package]
    name = "fixture"
    version = "0.1.0"
    edition = "2021"

    [[bin]]
    name = "fixture"
    path = "main.rs"
initial: |
  fn local_target(v: i32) -> i32 { v + 2 }

  fn use_it() -> i32 {
      local_target(1)
  }

  fn main() {
      println!("{}", use_it());
  }
keys:
  - "Down"
  - "Down"
  - "Down"
  - "C-f"
  - "C-f"
  - "C-f"
  - "C-f"
  - "M-."
  - "SETTLE=4:(1,3)"
  - "M-."
  - "SETTLE=8:(1,3)"
  - "M-."
  - "SETTLE=16:(1,3)"
  - "M-."
  - "SETTLE=32:(1,3)"
  - "M-."
  - "SETTLE=64:(1,3)"
  - "X"
expected_saved: |
  fn Xlocal_target(v: i32) -> i32 { v + 2 }

  fn use_it() -> i32 {
      local_target(1)
  }

  fn main() {
      println!("{}", use_it());
  }
