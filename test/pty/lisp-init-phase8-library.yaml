name: lisp-init-phase8-library
filename: phase8-init.txt
requires_feature: lisp
# PROOF 2's REPRESENTATIVE FIXTURE.
#
# The parent plan's §14 ("Proof 2 -- Representative user init") asks for
# "a tracked, isolated .config/kg/init.el fixture" covering setq/defvar/
# defconst/defcustom, defun and interactive commands, macros and
# backquote, hooks, key bindings, buffer-local-style configuration,
# loading helper files, and error handling.  Sub-plan 10A Decision 6
# names THIS case that fixture rather than writing a second one: Proof 2
# already exists as a distributed corpus (~97 PTY cases plant
# config_files: HOMEs, ~70 of them a .config/kg/init.el), and a new
# monolithic file would only be a second thing to drift.  The bullet ->
# case mapping, including the two bullets that are satisfiable only as
# recorded honesty, is in test/lisp-compat/README.md under "Proof 2".
#
# Sub-plan 08A's representative init.el, reconstructed construct for
# construct from its own description: setq, setq-default, defvar,
# defconst, two interactive defuns, global-set-key, add-hook, dolist, an
# alist lookup, mapc, mapconcat, custom-set-variables, a ?x literal, #x
# radix, and a require of a library planted beside it.  08A measured 11
# of 26 top-level forms failing on kg at the Phase 7 close; every one of
# them is here, and the second command reports every value the file
# computed so the case observes them rather than only observing that the
# file loaded.
config_files:
  .config/kg/lisp/phase8-pkg.el: |
    (setq phase8-pkg-value "pkg")
    (provide 'phase8-pkg)
  .config/kg/init.el: |
    ;;; init.el --- a representative kg init file.
    ;;
    ;; The leading comment block is deliberate: fe's top-form line latch
    ;; used to report a comment's line for the form that followed it.
    (setq phase8-name "boot")
    (setq-default phase8-default 1)
    (setq-local phase8-local 2)
    (defvar phase8-declared "declared" "A declaration.")
    (defconst phase8-constant 3 "A constant.")
    (setq phase8-sum 0)
    (setq phase8-changes 0)
    (dolist (n '(1 2 3)) (setq phase8-sum (+ phase8-sum n)))
    (setq phase8-alist '((a . 1) (b . 2)))
    (setq phase8-assoc (cdr (assq 'b phase8-alist)))
    (setq phase8-seen nil)
    (mapc (lambda (x) (setq phase8-seen (cons x phase8-seen))) '("x" "y"))
    (setq phase8-joined (mapconcat #'identity (reverse phase8-seen) ":"))
    (setq phase8-char ?x)
    (setq phase8-radix #x10)
    (require 'phase8-pkg)
    (defcustom phase8-fill-column 72
      "Column beyond which to break lines."
      :type 'integer :group 'editing)
    (custom-set-variables '(phase8-fill-column 80))
    (setq phase8-list '(one two))
    (add-to-list 'phase8-list 'zero)
    (setq phase8-copy (nreverse (list 1 2 3)))
    (setq phase8-dotted `(head . ,phase8-radix))
    (setq phase8-nested `(outer `(inner ,phase8-radix)))
    (setq phase8-lone (cond (5)))
    (setq phase8-key (kbd "C-c z"))
    (setq phase8-format (format "at %-8s col %d %c" phase8-name 3 187))
    ;; Error handling, §14's eighth Proof 2 bullet, in the two shapes an
    ;; init file actually uses: a guarded (require ...) of something that
    ;; may not be installed, and a guarded form whose condition is named
    ;; rather than caught wholesale.  Both values are reported below, so
    ;; the case observes that the handler ran and what it saw -- not just
    ;; that the init file survived.
    (setq phase8-require-error
      (condition-case err (require 'phase8-absent) (error (format "%S" err))))
    (setq phase8-named-error
      (condition-case err (car 1) (wrong-type-argument (format "%S" err))))
    (setq phase8-ignored (ignore-errors (car 1)))
    ;; ... and the init file kept going: everything after this point runs.
    (setq phase8-after-error "resumed")
    (defun phase8-command ()
      "A command from the 08D init file."
      (declare (indent 0))
      (interactive)
      (insert phase8-name))
    (defun phase8-report ()
      "Insert every value the init file computed."
      (interactive)
      (insert (mapconcat #'identity
        (list phase8-declared
              (number-to-string phase8-default)
              (number-to-string phase8-local)
              (number-to-string phase8-constant)
              (number-to-string phase8-sum)
              (number-to-string phase8-assoc)
              phase8-joined
              (number-to-string phase8-char)
              (number-to-string phase8-radix)
              phase8-pkg-value
              (number-to-string phase8-fill-column)
              (format "%S" phase8-list)
              (format "%S" phase8-copy)
              (format "%S" phase8-dotted)
              (format "%S" phase8-nested)
              (number-to-string phase8-lone)
              phase8-key
              phase8-format
              (documentation 'phase8-command)
              phase8-require-error
              phase8-named-error
              (format "%S" phase8-ignored)
              phase8-after-error
              (number-to-string phase8-changes))
        "|")))
    (global-set-key (kbd "C-c k") 'phase8-command)
    (global-set-key (kbd "C-c r") 'phase8-report)
    (add-hook 'after-change-functions
      (lambda (buf beg end oldlen)
        (setq phase8-changes (+ phase8-changes 1))))
initial: ""
keys:
  - C-c
  - k
  - RET
  - C-c
  - r
expected_saved: |-
  boot
  declared|1|2|3|6|2|x:y|120|16|pkg|80|(zero one two)|(3 2 1)|(head . 16)|(outer (quasiquote (inner (unquote phase8-radix))))|5|C-c z|at boot     col 3 »|A command from the 08D init file.|(file-missing "Cannot open load file" "No such file or directory" "phase8-absent")|(wrong-type-argument listp 1)|nil|resumed|2
