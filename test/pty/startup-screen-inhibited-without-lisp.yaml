# In a build without Lisp (WITH_LISP=0), (setq inhibit-startup-screen t) in init.el
# must suppress the startup screen.
name: startup-screen-inhibited-without-lisp
filename: startup.txt
requires_feature: -lisp
config_files:
  .config/kg/init.el: |
    (setq inhibit-startup-screen t)
initial: ""
keys:
  - h
  - e
  - l
  - l
  - o
expected_saved: "hello"
expected_screen_not_contains:
  - Just enough Emacs
  - Your fingers know this
