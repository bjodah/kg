name: lsp-rename-version-mismatch
# The same refusal as lsp-rename-stale-buffer-refused, spelled the
# protocol's way: a `documentChanges` identifier whose `version` is not
# the version kg last told this server about is a server answering about a
# document nobody is holding.  eglot refuses exactly this
# (eglot--apply-text-edits: "Edits on `%s' require version %d, have %d").
#
# --rename-version 42 against a document kg opened at version 1 is the
# whole case; nothing is typed while the answer is in flight, so the ONLY
# thing that can refuse this rename is the version check.
requires_feature: lsp
backend: tmux
key_delay: 0.35
env:
  KG_LSP_SERVER_C: "python3 {REPO}/test/fake_lsp_server.py --mode protocol --rename-shape documentChanges --rename-version 42 --rename-self 0:4:10 --rename-self 1:23:29"
filename: renversion.c
initial: |
  int target(void) { return 1; }
  int use(void) { return target(); }
keys:
  - "M-x"
  - "lsp-rename"
  - RET
  - "renamed"
  - RET
  - "C-l"
  - "C-l"
  - "C-l"
  - "C-l"
expected_saved: |
  int target(void) { return 1; }
  int use(void) { return target(); }
expected_screen_contains:
  - "is not at the version the edit names"
expected_screen_not_contains:
  - "Renamed"
