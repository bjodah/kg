# Sub-plan 09D Part 3: an out-of-memory caught *by name*, end to end
# inside the editor, at both of the seams a person can reach -- an init
# file and a command -- which is the whole point of the fe half of Phase 9
# (09B).
#
# Before this pin both halves failed: the raise degraded the condition
# object to nil, `ConditionMatches` answered false for every named
# handler, and only `(t ...)` could contain an exhaustion.  Now
# `arena-exhaustion` is a pre-built, rooted condition whose parent is
# `error`, so an init file can handle running out of memory the way it
# handles anything else -- and the forms after it still run, which is what
# `show-exhaustion` proves by existing, being bound, and inserting.
#
# One exhaustion per evaluation, deliberately: the step budget
# (KG_LISP_STEP_LIMIT, 2^20) is per `kg_lisp_load_file` / per command, not
# per form, and two arena-filling loops in one init file exhaust the
# budget before the second exhausts the arena (measured: `init.el:2:
# evaluation step limit exceeded`).  So the file catches once at load and
# the command catches once when it runs -- two separate budgets, two
# separate arena fills, both after a collection has given the first one's
# slots back.
#
# Both answers land in the *buffer* rather than the echo area on purpose:
# a saved-file assertion waits for kg to exit, so this case cannot race
# the pane-quiet capture the way the two echo-area cases in this set have
# to be timed against.
#
# The `out of memory` assertion below is the second half of "caught", and
# it is why this case is worth more than its saved file alone: a handler
# that ran is not proof that nothing *also* escaped to the echo area.  It
# was a tmux `expected_screen_not_contains` before this case moved to the
# pexpect backend, and it is stronger here -- with this backend the
# harness reads until kg exits and `expected_screen_not_contains` is
# matched against everything kg wrote to the terminal for the whole
# session, not against whatever the final frame happened to hold.  It is
# not vacuous: deleting the init file's `(arena-exhaustion 'by-name)`
# handler makes it fire (measured, `unexpected screen text: 'out of
# memory'`).  The remaining handler shapes (`(t ...)`, the
# condition object read back through the handler variable, the
# non-matching name that still escapes) are pinned in
# test_lisp.c:test_arena_exhaustion_conditions.
#
# No Emacs oracle: Emacs has no arena to exhaust.
#
# This is the one case of the five in the exhaustion set that fails on a
# kg built against the pre-Phase-9 fe (acc94f7): measured there, the
# saved file is `caught:` -- the init file's handler did not match, the
# raise escaped and `show-exhaustion` was never defined -- and the echo
# area carries `out of memory`.  The other four pass on that fe once the
# arena's slot-count literal is removed from them, because what they pin
# is kg-side seam behaviour that predates 09B.
name: lisp-exhaustion-caught-by-name
filename: lisp-exhaustion-caught.txt
requires_feature: lisp
# The arena is pinned to 1 MiB rather than inherited, and that is a
# property of the arena and the STEP BUDGET together, not a preference:
# a fill loop costs about 10.7 steps per cons, so KG_LISP_STEP_LIMIT's
# 2^20 steps buy roughly 97000 of them and any arena with more slots than
# that raises the uncatchable step-limit wall before it ever raises
# arena-exhaustion.  Measured at the compiled 10 MiB default (440489
# slots): `evaluation step limit exceeded', peak-live 97449.  So this case
# holds the conditions it was written against -- 42358 slots -- the way
# utils/check_lisp_gc_stress.py holds its own; Phase B of
# doc/plans/2026-08-19-fe-simplification-and-cheap-compat.md is the knob
# that makes that possible.
env:
  KG_LISP_ARENA_BYTES: "1M"
config_files:
  .config/kg/init.el: |
    ;;; init.el --- catches its own out-of-memory, by name.
    (setq exhaustion-by-name
      (condition-case e
          (let ((l nil)) (while t (setq l (cons 1 l))))
        (arena-exhaustion 'by-name)))
    (defun show-exhaustion ()
      "Append what the init file caught, then catch one more the same way."
      (interactive)
      (goto-char (point-max))
      (insert (format "%s %s" exhaustion-by-name
                      (condition-case e
                          (let ((l nil)) (while t (setq l (cons 1 l))))
                        (arena-exhaustion 'cmd-by-name)))))
    (global-set-key "C-c e" "show-exhaustion")
initial: "caught:"
keys:
  - C-c
  - e
expected_saved: "caught:by-name cmd-by-name"
# Nothing escaped: neither exhaustion reached the echo area.
expected_screen_not_contains:
  - "out of memory"
