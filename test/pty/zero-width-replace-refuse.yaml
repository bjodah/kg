# Refusing has to advance as far as accepting does.  Two "n" answers walk
# the empty match past "å" and past "b", so the "y" after them inserts in
# front of "c" and not in front of the line, and the "q" then stops the
# walk with the rest of the line untouched.  The byte-wise step never left
# the first empty match: every answer was asked about position 0 again and
# this buffer came back "Xåbc".  Answering "n" four times could not tell
# the two apart -- an unchanged buffer is what both produce.
name: zero-width-replace-refuse
filename: zero-width-refuse.txt
backend: pexpect
startup_delay: 1.0
key_delay: 0.2
initial: |
  åbc
keys:
  - M-x
  - query-replace-regexp
  - ENTER
  - 'a*'
  - ENTER
  - 'X'
  - ENTER
  - 'n'
  - 'n'
  - 'y'
  - 'q'
expected_saved: |
  åbXc
