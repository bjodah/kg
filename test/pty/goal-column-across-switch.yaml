# The goal column must not survive a buffer switch.
#
# It is view state: it means "the column the last vertical motion was aiming
# at", and only between two consecutive vertical motions in one buffer.  It
# used to live on the session record, where nothing dropped it on a switch --
# the end-of-keypress reset in editor_process_keypress() does not run for the
# C-x prefix or for the key that follows it.  Pointing a window's view at
# another buffer now clears it (buf_attach_view()).
#
# beta.txt is entered first: C-e puts point at column 10 of a 10-column line
# and C-n takes it down with a goal column of 10.  C-x b then switches to
# alpha.txt, where point is at the start of a two-column line.  The following
# C-n moves to column 0 of the next line, as in Emacs, so "Z" lands at the
# start of that line and not at its end.
name: goal-column-across-switch
filename: alpha.txt
config_files:
  beta.txt: |
    abcdefghij
    klmnopqrst
initial: |
  xy
  1234567890
keys:
  - C-x
  - C-f
  - C-a
  - C-k
  - "~/beta.txt"
  - RET
  - C-e
  - C-n
  - C-x
  - b
  - "alpha"
  - RET
  - C-n
  - "Z"
expected_saved: |
  xy
  Z1234567890
