# A TAB is one character but eight display columns: C-f over the leading
# TAB puts point at display column 8, which is what real Emacs shows here.
# kg used to show (1,2) because the mode line counted characters (1-based)
# instead of display columns.
name: modeline-column-after-tab
filename: col-tab.txt
backend: tmux
dimensions: [12, 40]
initial: "\tabc\nhéllo wörld\n"
keys:
  - C-f
expected_saved: "\tabc\nhéllo wörld\n"
expected_screen_contains:
  - "col-tab.txt  All (1,8)"
expected_screen_not_contains:
  - "(1,2)"
