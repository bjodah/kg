# A command Phase 17's audit deliberately kept out of the Lisp-callable
# set is still refused by name, with the wording the deleted allow-list
# used.  isearch-forward is the audit's second reason: a modal loop that
# owns the keyboard until it ends.
name: lisp-command-execute-not-allowed
filename: lisp-cmdexec-deny.txt
requires_feature: lisp
backend: tmux
initial: abc
keys:
  - M-x
  - eval-expression
  - RET
  - (command-execute 'isearch-forward)
  - RET
expected_saved: abc
expected_screen_contains:
  - "command is not allowed: isearch-forward"
