# start-process execs argv directly (no /bin/sh -c in between): shell
# metacharacters in an argument survive as literal bytes in the child's
# output, and no shell ever gets a chance to interpret the ";".
#
# The SETTLE after the RET is the case's only cover for an *asynchronous*
# delivery: the child has to run and its output has to reach the buffer
# before the trailer's C-x C-s writes the file, and nothing else in the
# harness waits for that.  This wait used to be financed with key_delay
# and re-sized twice against ever-slower lanes (0.15 failed a six-lane
# parallel valgrind run, 0.4 failed a CI_EXPENSIVE=1 four-lane one); a
# bounded wait on the text itself ends that arms race and costs a fast
# build nothing.
name: lisp-process-argv-not-shell
filename: argv.txt
requires_feature: lisp
backend: tmux
dimensions: [24, 80]
initial: ""
keys:
  - M-x
  - eval-expression
  - RET
  - (start-process "e" (current-buffer) "/bin/echo" "a; touch pwned")
  - RET
  - "SETTLE=60:a; touch pwned"
expected_saved: |
  a; touch pwned
