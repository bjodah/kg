# describe-bindings in a 40-column window, in the editor with no debugger
# in it.
#
# The property is describe-bindings-narrow-window.yaml's exactly -- a short
# row fits whole and a long one folds at the window edge rather than being
# cut off -- and it is a second file only because the FIRST SCREEN differs
# between the two builds: enumeration order is install order, dap_init()
# runs before the built-in maps are installed, and in this build it creates
# nothing at all, so the global map's own rows are what is on screen.
name: describe-bindings-narrow-window-without-dap
filename: describe-narrow.txt
requires_feature: -dap
backend: tmux
dimensions: [24, 40]
initial: |
  alpha
keys:
  - M-x
  - describe-bindings
  - RET
trailer_keys: [C-x, C-c]
expected_saved: |
  alpha
expected_screen_contains:
  - "Key bindings, and the map each is in."
  # Short rows still fit whole at this width.
  - "C-f         forward-char (global)"
  # A row that does not fit folds rather than being cut off.
  - "C-a         move-beginning-of-line"
  - "(global)"
  - "VLine"
