variables:
  - &ci_image 'cont-reg.bjodah.se:443/bjodah/triceratops-5:43'

when:
  - event: [push]

steps:
  - name: build-and-test
    image: *ci_image
    environment:
    commands:
      - apt-get install pmccabe
      - mkdir /tmp/kg && cp -ra . /tmp/kg/. && env -C /tmp/kg bash -l .ci/run-ci-steps.sh
