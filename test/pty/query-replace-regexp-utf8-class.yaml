# A bracket expression matches characters, so "[^[:ascii:]]\{2\}" takes
# the å and the ä together -- four bytes.  The byte-oriented engine took
# the two bytes of the å alone and left the ä behind; glyph snapping in
# the wrapper could widen that span but never lengthen it to the second
# character.  Checked against GNU Emacs rather than a hand-written
# result.  (The pattern is spelled in ASCII on purpose: what is under
# test is the class, not minibuffer input -- see minibuf-utf8-*.yaml for
# typed multi-byte patterns.)
name: query-replace-regexp-utf8-class
filename: replace_regexp_utf8_class.txt
backend: pexpect
startup_delay: 1.0
key_delay: 0.2
initial: |
  aåäb
keys:
  - M-x
  - query-replace-regexp
  - ENTER
  - '[^[:ascii:]]\{2\}'
  - ENTER
  - 'X'
  - ENTER
  - '!'
oracle: emacs
