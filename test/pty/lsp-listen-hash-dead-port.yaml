name: lsp-listen-hash-dead-port
# The socket wire's own failure, end to end: a server that announces a port
# nothing is listening on.
#
# `listen-hash: ` selects the wire, and the whole server is a printf: it
# writes one well-formed announce line -- prefix, port, " with hash ", a
# hash -- and then stays alive holding its standard output open, so there is
# no EOF and no garbage anywhere in this case.  Port 1 is the point: on the
# loopback interface nothing listens there (binding it needs privileges no
# test has), so kg's connect is refused, and a refused connect is the
# transport's ERR_IO.
#
# That is what makes this case the wire's, and nothing else's.  Every other
# way an LSP session can fail -- a server that never starts, one that says
# nothing, one that exits -- is reachable over plain stdio and reports
# itself as such; a connection that was refused is only reachable by having
# parsed an announce line and acted on it, which only this wire does.  Its
# sibling lsp-listen-hash-no-announce.yaml deliberately does NOT test that:
# it pins the client deadline, which is the same code on either wire.
#
# KG_LSP_TIMEOUT_MS is not generous but UNREACHABLE on purpose, twice the
# SETTLE budget below: if the deadline could fire first the echo area
# would say "initialize failed" and this case would be the deadline's
# again rather than the connection's -- which is exactly how it failed
# the valgrind lane under eight-way load when this margin was 30 s
# against a ladder that had grown past it.
#
# The SETTLE is the wait -- a shell has to start, write its line, be read,
# and the refused connect has to reach the echo area -- and a bounded wait
# on the words themselves costs nothing on a fast build where a
# key-financed wait would be paid in full every run (and re-sized every
# time a slower lane appears: this case failed the valgrind lane twice on
# exactly that).  The trailer is the proof the editor survived it: an X
# typed after the failure, saved, is a byte on disk only an editor still
# taking keys could have written.
requires_feature: lsp
backend: tmux
env:
  KG_LSP_SERVER_C: "listen-hash: printf 'Java Language Server listening at port 1 with hash 0123456789abcdef\\n'; sleep 60"
  KG_LSP_TIMEOUT_MS: "120000"
filename: xrefdeadport.c
initial: |
  int target(void) { return 1; }
  int use(void) { return target(); }
keys:
  - "M-."
  - "SETTLE=60:the connection to the server failed"
trailer_keys:
  - "X"
  - "C-x"
  - "C-s"
  - "C-x"
  - "C-c"
expected_saved: |
  Xint target(void) { return 1; }
  int use(void) { return target(); }
expected_screen_contains:
  - "the connection to the server failed"
