# The other half of the same rule: what matters to C-x C-e is whether a
# prefix argument was supplied, not what it counts to.  Zero is non-nil
# in Emacs, so C-u 0 C-x C-e prints the value into the buffer just as
# C-u C-x C-e does.
name: eval-last-sexp-prefix-zero-inserts
filename: eval-prefix-zero.fe
requires_feature: lisp
initial: (+ 3 2)
keys:
  - M->
  - C-e
  - C-u
  - "0"
  - C-x
  - C-e
expected_saved: (+ 3 2)5
