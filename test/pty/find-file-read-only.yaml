# C-x C-r opens a file read-only: the mode line says RO, and a key that
# would edit it is refused rather than changing the buffer.
#
# locked.txt is written first through an ordinary C-x C-f so there is a
# file to reopen; the Z typed after C-x C-r must go nowhere, which is
# what the untouched rw.txt saved below and the refusal on screen say
# together.
name: find-file-read-only
filename: rw.txt
backend: tmux
initial: "editable"
keys:
  - C-x
  - C-f
  - "locked.txt"
  - RET
  - "protected"
  - C-x
  - C-s
  - C-x
  - b
  - "rw"
  - RET
  - C-x
  - C-r
  - "locked.txt"
  - M-RET
  - Z
# Back to rw.txt before the trailer saves: saving the read-only buffer
# would prompt instead.  The trailing y answers "Modified buffer, really
# quit?" -- without it kg never exits, tmux kills it, and the run's
# coverage data is never written.
trailer_keys: ["C-x", "b", "rw", "RET", "C-x", "C-s", "C-x", "C-c", "y"]
expected_screen_contains:
  - "RO"
expected_saved: "editable"
