name: lsp-rename-undo-is-atomic
# A rename is ONE undo record however many occurrences it touched: C-_
# once puts the exact original text back, not the last occurrence only.
# That is not a property of the undo stack -- kg has no group bracket --
# but of how src/lsp_edit.c applies an edit: every occurrence in one
# buffer is spliced into a single replacement of the span they lie in, so
# there is one record to undo.
#
# Two occurrences, three lines apart, so a per-occurrence record would
# leave the file half renamed here and the expectation would fail.
requires_feature: lsp
backend: pexpect
key_delay: 0.35
env:
  KG_LSP_SERVER_C: "python3 {REPO}/test/fake_lsp_server.py --mode protocol --rename-self 0:4:10 --rename-self 2:23:29"
filename: renundo.c
initial: |
  int target(void) { return 1; }
  int other(void) { return 2; }
  int use(void) { return target(); }
keys:
  - "M-x"
  - "lsp-rename"
  - RET
  - "renamed"
  - RET
  - "C-l"
  - "C-l"
  - "C-l"
  - "C-_"
expected_saved: |
  int target(void) { return 1; }
  int other(void) { return 2; }
  int use(void) { return target(); }
