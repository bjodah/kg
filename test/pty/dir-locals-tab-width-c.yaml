# The C side of the same contract: main.c takes the c-mode block (width
# 4) while the java-mode block in the same file is ignored.
name: dir-locals-tab-width-c
filename: src/main.c
backend: tmux
dimensions: [12, 40]
workspace_files:
  .dir-locals.el: |
    ((java-mode . ((tab-width . 2)))
     (c-mode . ((tab-width . 4))))
initial: "\tX\n01234567X\n"
keys: []
expected_saved: "\tX\n01234567X\n"
expected_screen_contains:
  - "    X"
expected_screen_not_contains:
  - "        X"
