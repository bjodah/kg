# Provenance ledger for external/ -- third-party files vendored for
# TESTING ONLY, one entry per subfolder.  The policy (maintainer
# decision, 2026-08-20): nothing under external/ may reach a shipped
# artifact.  Not installed by `make install`, not copied by any
# packaging manifest (debian/, PKGBUILD), not embedded into the kg
# binary, and excluded from release tarballs -- utils/mkrel.sh builds
# them with `git archive`, which honors the `external/ export-ignore`
# line in .gitattributes.  utils/check_external_quarantine.py enforces
# every clause of this in `make check`.  Using GPL-licensed files for
# pure testing does not contaminate the license of the project at
# large; it does make this ledger the place that says so.

[elpa]
description = "Emacs Lisp packages the Lisp compatibility suite loads as fixtures"
license = "GPL-3.0-or-later"
license-source = "each file's header carries the standard GNU blurb; upstream repositories carry COPYING"

