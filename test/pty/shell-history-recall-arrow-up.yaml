name: shell-history-recall-arrow-up
filename: shell-history-arrow.txt
startup_delay: 0.5
key_delay: 0.15
initial: ""
keys:
  - M-1
  - "M-!"
  - "printf one"
  - RET  # prefix: insert output at point, buffer becomes "one"
  - M-1
  - "M-!"
  - Up   # Up-arrow is an alternative to M-p for history recall
  - RET
expected_saved: |-
  oneone
