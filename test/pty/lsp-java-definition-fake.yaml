name: lsp-java-definition-fake
# The Java half of the mode -> spec -> environment wiring, end to end and
# without jdt.ls: a .java file selects Java mode, Java mode selects the
# jdtls spec, and the spec reads KG_LSP_SERVER_JAVA -- which points at
# test/fake_lsp_server.py here, so what is under test is kg's table rather
# than a language server.  A wrong environment name would exec the built-in
# `jdtls` instead, and on a box without one that is a dead client and no
# jump at all.
#
# The pom.xml is planted by `workspace_files:` so the root walk has a marker
# to find in the case's own temporary directory, which is the root kg then
# starts the server in.  It is the marker that decides, not the .git the
# temporary directory does not have.  jdt.ls's own Maven importer looks for
# exactly this file, which is why it is the marker.
#
# The assertion is the saved file, as in lsp-definition-basic.yaml: the fake
# answers --definition-self 2:15, a Location in the document kg itself
# opened, and the "X" typed after the jump says which byte point landed on.
# Line 2 character 15 in the protocol's zero-based numbering is the "u" of
# the last method's "use".
#
# The two C-l are the wait: M-. sends the question and returns, so the case
# has to leave time for a Python interpreter to start, handshake and reply,
# and C-l is the one key that repaints without moving point.
requires_feature: lsp
backend: pexpect
key_delay: 0.35
env:
  KG_LSP_SERVER_JAVA: "python3 {REPO}/test/fake_lsp_server.py --mode protocol --definition-self 2:15"
filename: X.java
workspace_files:
  pom.xml: |
    <project>
      <modelVersion>4.0.0</modelVersion>
      <groupId>fixture</groupId>
      <artifactId>fixture</artifactId>
      <version>0.1.0</version>
    </project>
initial: |
  class X {
      static int target() { return 1; }
      static int use() { return target(); }
  }
keys:
  - "M-."
  - "C-l"
  - "C-l"
  - "X"
expected_saved: |
  class X {
      static int target() { return 1; }
      static int Xuse() { return target(); }
  }
