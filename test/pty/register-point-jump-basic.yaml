# C-x r SPC saves point under the register named by the next key, and
# C-x r j goes back to it from anywhere else in the buffer.  The typed
# X is what says point really landed on the saved position rather than
# where it was left.
name: register-point-jump-basic
filename: reg.txt
initial: |-
  alpha
  beta
  gamma
keys:
  - C-n
  - C-e
  - C-x
  - r
  - SPC
  - a
  - M-<
  - C-x
  - r
  - j
  - a
  - X
  - C-x
  - C-s
expected_saved: |-
  alpha
  betaX
  gamma
