# Phase 1 of doc/plans/2026-08-14-embedded-prelude.md: proof, in a real
# editor session rather than test_lisp.c's in-process harness, that a
# deferred name works exactly like an eager one the first time anything
# calls it.
#
# `mapconcat` and `mapcar` are both deferred, and both call `funcall` on
# whatever function they were handed -- `number-to-string` and `1+`, also
# deferred -- from INSIDE their own (freshly forced) body.  So this one
# `eval-expression` forces four stubs, two of them from a call site that
# is itself a stub being forced for the first time, which is the case a
# stub that only worked when called directly would not catch.
#
# No Emacs oracle: this pins kg's own lazy-loading mechanism, which has
# no Emacs analogue to compare against (Emacs' autoload is a different
# shape entirely, and the point under test is kg's implementation detail
# staying invisible to a real session, not a language-level behaviour
# Emacs also has an opinion on).
name: lisp-deferred-stub-first-call
filename: lisp-deferred-stub.txt
requires_feature: lisp
initial: ""
keys:
  - M-x
  - eval-expression
  - RET
  - (insert (mapconcat 'number-to-string (mapcar '1+ '(1 2 3)) ","))
  - RET
expected_saved: "2,3,4"
