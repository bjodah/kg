# The other half of the layout's promise: F12 twice puts back the layout
# the user had, and a disconnect makes the session-only keys inert again.
#
# Split from dap-panes-and-layout.yaml because a screen assertion reads the
# LAST frame only -- "the grid is up" and "the grid is gone" cannot both be
# the last frame of one case (doc/plans/dap/02-ui.md).
#
# The prior layout is deliberately asymmetric -- one horizontal split, point
# left in the lower window -- so that a restore which merely rebuilt a
# default single window would fail here.
name: dap-layout-restores-and-disconnects
filename: main.c
requires_feature: dap
backend: tmux
dimensions: [40, 120]
initial: |
  #include <stdio.h>

  int main(void)
  {
  	int answer = 21 + 21;
  	printf("%d\n", answer);
  	return 0;
  }
workspace_files:
  .kg-dap.json: |
    { "version": 1,
      "configurations": [
        { "name": "fake",
          "adapter": "lldb-dap",
          "request": "launch",
          "arguments": { "program": "${file}" } } ] }
env:
  KG_DAP_ADAPTER_LLDB: >-
    python3 {REPO}/test/fake_dap_adapter.py --mode protocol
    --capabilities '{"supportsConfigurationDoneRequest":true}'
    --stopped-after configurationDone
    --stopped-body '{"reason":"breakpoint","threadId":1,"allThreadsStopped":true}'
    --body 'threads:{"threads":[{"id":1,"name":"main"}]}'
    --body 'stackTrace:{"stackFrames":[{"id":11,"name":"main","line":5,"source":{"path":"{CWD}/main.c"}}]}'
    --body 'scopes:{"scopes":[{"name":"Locals","variablesReference":21}]}'
    --variables '{"21":[{"name":"answer","value":"42","variablesReference":0}]}'
keys:
  - M-x
  - dap-debug
  - RET
  - RET
  - SETTLE=15:(5,
  # The user's own layout, and a marker typed in it so the restore has
  # something to be checked against in the saved file too.
  - C-x
  - "2"
  - F12
  - SETTLE=15:*dap-stack*
  - F12
  - SETTLE=5
  # The session goes.  The keys it owned go with it, so F8 below is the
  # user's own key again and types nothing.
  - M-x
  - dap-disconnect
  - RET
  - SETTLE=5
  - F8
  - C-e
  - //end
expected_saved: |
  #include <stdio.h>

  int main(void)
  {
  	int answer = 21 + 21;//end
  	printf("%d\n", answer);
  	return 0;
  }
expected_screen_not_contains:
  # The grid is gone, and with it every pane it arranged.
  - "*dap-stack*"
  - "*dap-locals*"
  - "*dap-breakpoints*"
