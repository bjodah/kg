name: lsp-definition-basic
# M-. asks the language server where the symbol at point is defined and puts
# point there.  The server here is test/fake_lsp_server.py in place of
# clangd (KG_LSP_SERVER_C), answering --definition-self: a Location in the
# document the client itself opened, which is how a case whose file lives in
# a temporary directory nobody named can still assert an exact target.
#
# The assertion is the saved file rather than the screen: after the jump a
# single "X" is typed at point, so the byte it lands on is the whole answer.
# Line 2 character 4 in the protocol's zero-based numbering is the "u" of
# "use" on the third line, and the X in front of it says the line, the
# column and the utf-8/utf-16 negotiation all came out right.
#
# The two C-l between M-. and the X are the wait.  The request is
# asynchronous by design -- the command returns the moment it has sent the
# question and the answer lands in a later lsp_poll() -- so the case has to
# leave time for a Python interpreter to start, handshake, and reply.  C-l
# is chosen because it is the one key that repaints without moving point,
# so it costs a key_delay and changes nothing whether the answer has
# arrived yet or not.
requires_feature: lsp
backend: pexpect
key_delay: 0.35
env:
  KG_LSP_SERVER_C: "python3 {REPO}/test/fake_lsp_server.py --mode protocol --definition-self 2:4"
filename: xrefdef.c
initial: |
  int target(void) { return 1; }
  int other(void) { return 2; }
  int use(void) { return target(); }
keys:
  - "M-."
  - "C-l"
  - "C-l"
  - "X"
expected_saved: |
  int target(void) { return 1; }
  int other(void) { return 2; }
  int Xuse(void) { return target(); }
