# Query replace stops where the engine gave up instead of walking on to
# the next line: the line it could not finish may well hold a match, and
# replacing the one after it would quietly skip that.  So the second line
# keeps its "aab", no prompt is ever asked, and the "!" that would have
# answered one self-inserts at point -- as it does in an empty buffer.
name: query-replace-regexp-too-complex
filename: too-complex-replace.txt
backend: pexpect
startup_delay: 1.0
key_delay: 0.2
initial: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\naab\n"
keys:
  - M-x
  - query-replace-regexp
  - RET
  - '\(a*\)*b'
  - RET
  - 'Z'
  - RET
  - '!'
expected_saved: "!aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\naab\n"
