name: replace-newlines
filename: once-upon-a-time.txt
initial: |
  once
  upon
  a
  time
keys:
  - M-h
  - "M-%"
  - C-q
  - C-j
  - RET
  - SPC
  - RET
  - "!"
# M-h marks past the paragraph's closing newline, so that newline is
# replaced too and the saved file ends with a space.  emacs -q saves the
# same text plus its own final newline (newline policy, not the behavior
# under test).
expected_saved: "once upon a time "
