# Sub-plan 09D Part 3: an out-of-memory caught *by name*, end to end
# inside the editor, at both of the seams a person can reach -- an init
# file and a command -- which is the whole point of the fe half of Phase 9
# (09B).
#
# Before this pin both halves failed: the raise degraded the condition
# object to nil, `ConditionMatches` answered false for every named
# handler, and only `(t ...)` could contain an exhaustion.  Now
# `arena-exhaustion` is a pre-built, rooted condition whose parent is
# `error`, so an init file can handle running out of memory the way it
# handles anything else -- and the forms after it still run, which is what
# `show-exhaustion` proves by existing, being bound, and inserting.
#
# One exhaustion per evaluation, deliberately: the step budget
# (KG_LISP_STEP_LIMIT, 2^20) is per `kg_lisp_load_file` / per command, not
# per form, and two arena-filling loops in one init file exhaust the
# budget before the second exhausts the arena (measured: `init.el:2:
# evaluation step limit exceeded`).  So the file catches once at load and
# the command catches once when it runs -- two separate budgets, two
# separate arena fills, both after a collection has given the first one's
# slots back.
#
# Both answers land in the *buffer* rather than the echo area on purpose:
# a saved-file assertion waits for kg to exit, so this case cannot race
# the pane-quiet capture the way the two echo-area cases in this set have
# to be timed against.  The remaining handler shapes (`(t ...)`, the
# condition object read back through the handler variable, the
# non-matching name that still escapes) are pinned in
# test_lisp.c:test_arena_exhaustion_conditions.
#
# No Emacs oracle: Emacs has no arena to exhaust.
name: lisp-exhaustion-caught-by-name
filename: lisp-exhaustion-caught.txt
requires_feature: lisp
config_files:
  .config/kg/init.el: |
    ;;; init.el --- catches its own out-of-memory, by name.
    (setq exhaustion-by-name
      (condition-case e
          (let ((l nil)) (while t (setq l (cons 1 l))))
        (arena-exhaustion 'by-name)))
    (defun show-exhaustion ()
      "Append what the init file caught, then catch one more the same way."
      (interactive)
      (goto-char (point-max))
      (insert (format "%s %s" exhaustion-by-name
                      (condition-case e
                          (let ((l nil)) (while t (setq l (cons 1 l))))
                        (arena-exhaustion 'cmd-by-name)))))
    (global-set-key "C-c e" "show-exhaustion")
initial: "caught:"
keys:
  - C-c
  - e
expected_saved: "caught:by-name cmd-by-name"
