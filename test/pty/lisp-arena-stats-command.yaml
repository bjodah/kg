# Sub-plan 09D Part 2.  The arena-diagnostics command's output, on a real
# terminal.  test/lisp-compat/features.json's `command-lisp-arena-stats`
# row cites this case and test_cmd.c:test_lisp_arena_stats_renders; that
# one pins the rendering in-process, this one pins that the same line
# reaches the echo area of a live editor.
#
# No Emacs oracle, by design: Emacs has no arena, no fixed slot count and
# no collector of fe's shape, so this is kg policy pinned against kg's own
# measured behaviour (the 09 set's compatibility-direction note).
#
# The wide terminal is deliberate: the line is ~82 columns on a session
# that has only loaded the prelude, and an 80-column screen would truncate
# the `fails` field this case exists to read.
name: lisp-arena-stats-command
filename: lisp-arena-stats.txt
requires_feature: lisp
backend: tmux
dimensions: [24, 120]
initial: ""
keys:
  - M-x
  - lisp-arena-stats
  - RET
  - o
  - k
expected_saved: ok
expected_screen_contains:
  # The counters, in the order the renderer writes them.  586986 slots and
  # a 10917-frame capacity are the COMPILED DEFAULT arena's measured
  # partitioning at the payload-substrate pin (doc/fe-upstream.md's row).
  # That default is 10 MiB since Phase B of
  # doc/plans/2026-08-19-fe-simplification-and-cheap-compat.md; the same fe
  # partitions the 1 MiB arena it replaced into 56145/1086, which is the
  # arena the pin series below was measured against -- 56147/1087 at the
  # let-binding-buffer-tag pin, 56263/1089 at the Phase 20 pin, 56259/1090
  # at the Phase 19 pin, 56225/1095 at the Phase 12 pin, 56226/1095 at the
  # Phase 11 pin and 56224/1096 at Phase 10's.  fe re-partitions at some
  # pins and the host may ask for any size, so both numbers here are
  # measured, never carried forward.
  # The payload substrate itself takes NO bytes here: `FeOpenContext` carves
  # no payload region.  What moved is `FeMinimumArenaSize()`, by 280 bytes --
  # 224 for the fourteen objects the new `payload-exhaustion` condition row
  # builds at context open, and 56 for the seven `FeContext` fields the
  # region's bookkeeping adds to the arena's fixed header -- and the fixed
  # 1 MiB arena of that pin answered it by moving one frame's worth of
  # bytes and two object slots.
  # Phase 14's fe widened a symbol object by one cons and added eight
  # primitives, which grew FeMinimumArenaSize by 2264 bytes; the arena
  # partition answers by moving two frame slots' worth of bytes to the
  # object side, so the object count RISES as the frame count falls.
  # `fails 0` is the claim that a session which has only booted has never
  # failed an allocation.  `GC 1`, not `GC 0`: the post-prelude collect
  # (doc/plans/2026-08-14-embedded-prelude.md, "Post-prelude collect --
  # results") is kg_lisp_init()'s own last act, so a session that has only
  # booted has already collected exactly once by the time this command can
  # run.
  - "Arena: 586986 slots,"
  - " free, peak "
  - "; GC 1; roots "
  - "/10917; fails 0"
expected_screen_not_contains:
  - "Lisp not available"
