# Sub-plan 06E.  C-g must cancel a running Lisp evaluation and say so, and
# it must say `Quit` rather than an error: src/cmd.c reads the completion
# *kind* the adapter latched (kg_lisp_last_error_kind) instead of comparing
# the reported message to the string "Quit".
#
# Timing, deliberately, and why this is not flaky.  The keys are queued in
# the pty: `C-c` `s` starts the command and the `C-g` lands one key_delay
# (0.05 s, the floor CLAUDE.md sets -- below 0.03 kg reads the burst as a
# paste) later, where kg's interrupt poll finds it.  The race the case has
# to avoid is the *step budget* finishing the loop before that: a bare
# `(while t 1)` exhausts 2^20 steps in ~10 ms on an idle box, which is
# faster than the C-g arrives.  So the loop's body is a `concat` of a long
# string, which makes each step slow rather than making the loop longer,
# and the length is what buys the margin: 2^20 steps is a constant, so the
# only knob is how many bytes each iteration copies.
#
# THE LENGTH IS RE-MEASURED AT EVERY PIN THAT MAKES STRINGS FASTER, and
# Phase 25 is one: a 400-character pad ran ~900 ms when this case was
# written and ~50 ms once a fe string became a header over payload bytes
# instead of a chain of seven-byte cells, which is under the 0.05 s the
# C-g needs.  Five doublings take the pad to 12800 characters and the loop
# back to ~980 ms, measured three times identically, and cost the init
# file nothing (they are five `concat`s, where `pad` itself is quadratic).
# ~20x the window the C-g needs, and every slower configuration (a
# sanitizer lane, valgrind, a loaded box) widens that margin rather than
# narrowing it.  The run itself still ends at the C-g, ~0.1 s in, not at
# the budget.
#
# tmux, because the assertion is a status-line one: the saved file is
# unchanged, which is the other half of "the command was cancelled".
name: lisp-quit-cancels-evaluation
filename: lisp-quit.txt
requires_feature: lisp
backend: tmux
dimensions: [12, 60]
config_files:
  .config/kg/init.el: |
    (defun pad (n)
      (let ((r ""))
        (dotimes (i n) (setq r (concat r "x")))
        r))
    (setq spin-pad (pad 400))
    (dotimes (i 5) (setq spin-pad (concat spin-pad spin-pad)))
    (defun spin ()
      "Loop until cancelled or until the step budget stops it."
      (interactive)
      (while t (concat spin-pad spin-pad)))
    (global-set-key "C-c s" "spin")
initial: "before"
keys:
  - C-c
  - s
  - C-g
expected_saved: "before"
expected_screen_contains:
  - "Quit"
expected_screen_not_contains:
  - "step limit"
  - "Lisp error"
