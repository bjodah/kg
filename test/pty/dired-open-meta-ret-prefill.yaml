# M-RET accepts the path prompt exactly as written, so C-x C-f M-RET on
# the untouched prefill (the current file's directory) lists that
# directory.  This is a deliberate deviation from Emacs, which has no such
# binding; plain Enter would take the picker's selection and descend into
# it instead.
#
# The case's temporary directory holds notes.txt and the "home" directory
# the harness makes $HOME, so those two entries are the listing.  The
# header line's absolute path is not predictable, and neither is the
# entry count: the tmux backend keeps its socket in that directory too.
name: dired-open-meta-ret-prefill
filename: notes.txt
backend: tmux
initial: |
  notes
keys:
  - C-x
  - C-f
  - M-RET
# q leaves dired for notes.txt before the trailer saves; saving from the
# read-only dired buffer would prompt for a filename instead.
trailer_keys: [q, C-x, C-s, C-x, C-c]
expected_saved: |
  notes
expected_screen_contains:
  - "(Dired RO)"
  - "  home/"
  - "  notes.txt"
