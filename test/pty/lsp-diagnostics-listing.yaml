name: lsp-diagnostics-listing
# Diagnostics are the one part of the protocol kg never asks for: the
# server publishes them, and `M-x lsp-diagnostics` lists what has arrived.
# The server is test/fake_lsp_server.py in place of clangd
# (KG_LSP_SERVER_C), told to publish two of them -- one error, one warning
# -- about the document the client itself opens, which is how a case whose
# file lives in a temporary directory nobody named can still assert exact
# rows.
#
# The command is run twice on purpose, and that is the feature rather than
# a workaround.  kg opens a document lazily, on the first command that
# needs one (src/lsp_sync.h), so the first `M-x lsp-diagnostics` is what
# spawns the server and sends the didOpen the publish answers; the C-l
# after it are the wait for a Python interpreter to start, handshake and
# publish.  The second one lists what arrived.  A kg that listed nothing
# forever in a session where no xref command had been run would be the
# defect this shape avoids.
#
# What is asserted is the listing itself: the header counting the answer,
# and one row per diagnostic in kg's compilation-shaped
# `file:line:col: severity: message` form, in file and position order.
# The columns are the protocol's own character offsets counted from one,
# which is a byte column on every line that is ASCII.
#
# The listing is displayed in the other window and never selected, the way
# occur's is, so the current buffer at the end is still diag.c and the
# saved file is the initial one -- asserting that listing diagnostics
# changed nothing on disk.
requires_feature: lsp
backend: tmux
dimensions: [24, 80]
key_delay: 0.35
env:
  KG_LSP_SERVER_C: "python3 {REPO}/test/fake_lsp_server.py --mode protocol --publish-diagnostic '0:4:1:cannot find target' --publish-diagnostic '1:23:2:unused result'"
filename: diag.c
initial: |
  int target(void) { return 1; }
  int use(void) { return target(); }
keys:
  - "M-x"
  - "lsp-diagnostics"
  - "RET"
  - "C-l"
  - "C-l"
  - "C-l"
  - "M-x"
  - "lsp-diagnostics"
  - "RET"
  - "C-l"
expected_saved: |
  int target(void) { return 1; }
  int use(void) { return target(); }
expected_screen_contains:
  - "2 diagnostics"
  - "diag.c:1:5: error: cannot find target"
  - "diag.c:2:24: warning: unused result"
