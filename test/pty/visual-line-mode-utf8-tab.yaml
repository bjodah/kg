name: visual-line-mode-wraps-utf8-and-tabs-by-display-column
filename: line.txt
initial: "αβ\tXYZ"
dimensions: [10, 8]
keys:
  - M-x
  - visual-line-mode
  - RET
  - C-n
  - Q
# Display columns: α=0, β=1, TAB fills 2..7, X=8, Y=9, Z=10.  The 8-column
# window wraps after column 7, so C-n from column 0 lands on X.
expected_saved: "αβ\tQXYZ"
