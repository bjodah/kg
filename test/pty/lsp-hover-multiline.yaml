name: lsp-hover-multiline
# An answer with more than one line in it does not fit the echo area, so
# kg says the first line there and writes the whole of it to *lsp-hover*,
# which the message names.  That buffer is created lazily and never
# selects itself -- `C-x b` is the whole of its interface, exactly as
# *lsp-log*'s is -- which is what the second half of this case walks to.
#
# The divergence from Emacs is deliberate and documented (src/lsp_hover.h):
# eglot's eldoc shows the same first line and offers the rest through
# `M-x eldoc-doc-buffer`, on demand; kg writes the rest unconditionally
# and shows it never.  Nothing is lost either way.
#
# The `\n` in the fake's answer is the fake's own escape (it turns a
# literal backslash-n into a newline), which is why this case's env value
# is a single-quoted YAML scalar: a double-quoted one would turn it into a
# real newline inside the command line.
#
# Nothing on disk changes; the trailer is C-x C-c alone because the
# selected buffer at the end is *lsp-hover*, which has no file.
requires_feature: lsp
backend: tmux
dimensions: [24, 80]
key_delay: 0.35
env:
  KG_LSP_SERVER_C: 'python3 {REPO}/test/fake_lsp_server.py --mode protocol --hover "### function target\n\n---\n\n```c\nint target(void)\n```"'
filename: hovlong.c
initial: |
  int target(void) { return 1; }
  int use(void) { return target(); }
keys:
  - "M-x"
  - "lsp-hover"
  - "RET"
  - "C-l"
  - "C-l"
  - "C-l"
  - "C-x"
  - "b"
  - "*lsp-hover*"
  - "RET"
  - "C-l"
trailer_keys:
  - "C-x"
  - "C-c"
expected_saved: |
  int target(void) { return 1; }
  int use(void) { return target(); }
expected_screen_contains:
  - "function target"
  - "int target(void)"
