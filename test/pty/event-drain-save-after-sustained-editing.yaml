# Regression pin for Plan 03 Phase 5's safe-point drain (src/main.c's three
# kg_event_drain_safe() call sites).
#
# The typed event queue's ring holds KG_EVENT_RING_MAX (64) entries, and
# KG_EVENT_LIFECYCLE_RESERVE (4) of those never go to a droppable text
# change -- they stay free for a lifecycle transition (open, kill, view
# attach/detach, save, mode change).  Before Phase 5 wired a drain into the
# main loop, nothing ever popped the queue, so a session's own traffic
# could exhaust that reserve, and src/fileio.c's before-save reservation
# correctly (for the wrong reason) refuses the whole save -- file
# untouched -- rather than let an unobservable transition through.
#
# 65 edits, each on a different row's column 0, are what actually fills the
# ring: event.c's coalescing exists precisely so ordinary same-spot typing
# (self-insert after self-insert at one growing point) collapses into one
# ring entry, so plain typing alone never stresses it.  Scattering the
# edits -- Down, then C-a, before each insert -- makes every one land far
# from the previous edit's post-edit span, so none of them coalesce, the
# same as editing different parts of a file across a session would.  Two
# startup lifecycle events (buffer opened, view attached) already sit in
# the ring ahead of these, so 65 is comfortably past the 58 more needed to
# reach the ring's droppable ceiling (60 total).
#
# From there, three saves in a row spend the reserve: the first two (four
# lifecycle events: before/after times two) fill the ring from 60 to 64,
# and the third's before-save reservation is exactly the one this
# regression refuses without the drain.  This was checked by hand against
# a build with every kg_event_drain_safe() call site removed: that third
# save is silently refused, and the session cannot even exit cleanly
# afterward, since the buffer never stops looking modified.  With the
# drain wired in after every command, the ring never accumulates more than
# a handful of entries between keystrokes, so all three saves land and the
# file ends up with everything typed, not just the first save's share.
