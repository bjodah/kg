name: lsp-listen-hash-no-announce
# A socket-wire server that starts, says nothing, and never announces a
# port.  Nothing kg can do will make it speak, and the editor has to stay an
# editor while that is true.
#
# `listen-hash: sleep 60` is the whole server: a child that is alive, holds
# its standard output open, and never writes the announce line.  It is the
# failure the transport cannot see -- there is no EOF, no refused connection
# and no garbage, only silence -- so nothing in the transport ends it.  What
# ends it is the deadline every request already has (KG_LSP_TIMEOUT_MS, one
# second here rather than the default thirty): the `initialize` queued at
# spawn goes unanswered, is abandoned, and the client dies with it, which is
# what puts a message where the user is looking.
#
# So what this case pins is the deadline, over the socket wire -- and the
# deadline is the same code on either wire.  Delete `listen-hash: ` from the
# env below and it still passes, screen assertion included, because a `sleep
# 60` on stdio is silent in exactly the same way: that is not a hole in the
# case, it is what the case is about.  The wire's own negative behaviour is
# tested where it can be told apart from silence -- a refused connection in
# lsp-listen-hash-dead-port.yaml, and announce-line parsing, bounds and
# post-failure logging in test/test_lsp_transport.c, which drives the
# transport directly and can assert which error it was.
#
# The C-l are the wait -- a shell has to start and the deadline has to pass
# -- and C-l is the one key that repaints without moving point.
#
# The trailer is the proof the editor survived it: an X typed after the
# failure, saved, is a byte on disk that only an editor still taking keys
# could have written.  Point never moved, so it lands at the very start.
requires_feature: lsp
backend: tmux
key_delay: 0.35
env:
  KG_LSP_SERVER_C: "listen-hash: sleep 60"
  KG_LSP_TIMEOUT_MS: "1000"
filename: xrefsilent.c
initial: |
  int target(void) { return 1; }
  int use(void) { return target(); }
keys:
  - "M-."
  - "C-l"
  - "C-l"
  - "C-l"
  - "C-l"
  - "C-l"
  - "C-l"
  - "C-l"
  - "C-l"
trailer_keys:
  - "X"
  - "C-x"
  - "C-s"
  - "C-x"
  - "C-c"
expected_saved: |
  Xint target(void) { return 1; }
  int use(void) { return target(); }
expected_screen_contains:
  - "xref-find-definitions: initialize failed"
