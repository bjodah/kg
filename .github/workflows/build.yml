name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: ${{ matrix.compiler }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # No macOS gcc cell: /usr/bin/gcc there is Apple Clang wearing a
        # different name, so it repeated the macOS clang cell exactly.
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
      fail-fast: false
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Verify submodules
        run: |
          test -f fe/fe.c
          test -f fe/tiny-regex-c/re.c
      # The PTY acceptance suite is most of `make check`: 71 of its cases
      # drive kg through tmux and 17 compare it against a real Emacs.
      # Without these the suite either cannot import its own harness or
      # skips the oracle silently, so a green run would mean nothing.
      - name: Install test tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux emacs-nox python3-pexpect python3-yaml
      - name: Install test tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tmux emacs
          python3 -m pip install --break-system-packages pexpect PyYAML
      # Which compiler this cell really has, among the rest of the box.
      - name: Tool versions
        run: ./utils/print-tool-versions.sh
      - name: Build
        run: make
      # --require-tools turns a missing tmux or Emacs into a loud failure
      # instead of a skip, so this step cannot pass by not running.
      - name: Run tests
        run: make check PTY_ACCEPT_ARGS=--require-tools
      - name: Install to ~/tmp and inspect
        run: |
          DESTDIR=~/tmp make install
          ls -la ~/tmp/usr/local/bin/kg
          ls -la ~/tmp/usr/local/share/man/man1/kg.1
          ~/tmp/usr/local/bin/kg -V
      - name: Build .deb package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y debhelper build-essential
          make deb
