# Storing under a name that is already in the table replaces its contents
# in place rather than taking a second slot: saving 'a' twice at two
# different points and then jumping to 'a' lands at the newer point, not
# the one first saved.  (register-table-full.yaml is the companion proof
# that a reuse like this never costs a free slot.)
name: register-slot-reuse
filename: reg.txt
initial: |-
  one
  two
  three
keys:
  - C-n
  - C-x
  - r
  - SPC
  - a
  - C-n
  - C-x
  - r
  - SPC
  - a
  - M-<
  - C-x
  - r
  - j
  - a
  - "X"
  - C-x
  - C-s
expected_saved: |-
  one
  two
  Xthree
