# M-x dired with a blank answer lists the current buffer's own directory:
# the prompt's default is that directory, tilde expanded once.
#
# The tilde expansion's failure return used to be discarded here, so a
# $HOME too long to expand into the prompt buffer would have left a
# literal "~..." naming nothing (or, if such a directory existed, the
# wrong one). The default path is now built in one helper that reports
# rather than passes that on; this case is what runs it.
#
# The case's temporary directory holds notes.txt and the "home" directory
# the harness makes $HOME, so those two entries are the listing.
name: dired-blank-answer-uses-default
filename: notes.txt
backend: tmux
initial: |
  notes
keys:
  - M-x
  - dired
  - RET
  # M-RET accepts the (empty) text as typed instead of completing onto
  # whichever entry the picker had selected, which is the only way to
  # give this prompt a blank answer.
  - M-RET
# q leaves dired for notes.txt before the trailer saves; saving from the
# read-only dired buffer would prompt for a filename instead.
trailer_keys: [q, C-x, C-s, C-x, C-c]
expected_saved: |
  notes
expected_screen_contains:
  - "(Dired RO)"
  - "  notes.txt"
