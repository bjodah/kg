# The break auto-fill--maybe-break makes is a single (replace-region ...)
# call, so one undo step reverts exactly the break -- not the character
# whose insertion triggered it, and not further back than that.  Typing
# stops right at the 11th character ("w", the one that pushes the line
# past fill-column 10 and triggers the break), so the break's own undo
# record is the most recent one on the stack: one C-_ has to restore the
# space auto-fill replaced and leave the "w" exactly where it was typed,
# with no newline in the buffer at all.
name: lisp-auto-fill-mode-undo
filename: auto-fill-undo.txt
requires_feature: lisp
config_files:
  .config/kg/lisp/auto-fill.fe: |
    (provide 'auto-fill)
    (defvar fill-column 70
      "Column auto-fill-mode tries to keep lines at or under.")
    (defun auto-fill--column-at (pos)
      (goto-char pos)
      (current-column))
    (defun auto-fill--find-break (from to)
      (save-excursion
        (let ((pos from) (break-pos nil))
          (while (and (< pos to) (<= (auto-fill--column-at pos) fill-column))
            (if (eq (char-after pos) 32)
                (setq break-pos pos))
            (setq pos (1+ pos)))
          break-pos)))
    (defun auto-fill--maybe-break (buf start end old-len)
      (when (< start end)
        (with-current-buffer buf
          (save-excursion
            (when (< fill-column (auto-fill--column-at end))
              (let* ((line (bounds-of-thing-at-point 'line))
                     (break-pos (and line (auto-fill--find-break (car line) end))))
                (when break-pos
                  (replace-region break-pos (1+ break-pos) "\n"))))))))
    (defun auto-fill-mode ()
      "Break lines at `fill-column' as they are typed past it."
      (interactive)
      (add-hook 'after-change-functions 'auto-fill--maybe-break t))
  .config/kg/init.fe: |
    (require 'auto-fill)
    (setq fill-column 10)
    (auto-fill-mode)
initial: ""
keys:
  - 'w'
  - 'o'
  - 'r'
  - 'd'
  - SPC
  - 'w'
  - 'o'
  - 'r'
  - 'd'
  - SPC
  - 'w'
  - C-_
expected_saved: "word word w"
