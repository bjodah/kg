# C-x r SPC fills all 32 register slots (a-z, 0-5); a 33rd distinct name
# is refused with "All 32 registers are in use", while re-storing under a
# name already in the table (here 'a', at a different point) still succeeds
# -- a reuse replaces its own slot's contents, it never claims a new one.
# The jump-back-to-'a' + typed marker proves the reuse really moved the
# saved position (not just accepted without effect); the final refusal
# message, captured on screen as the very last thing that happens, proves
# the table is still exactly full at 32 and no slot leaked from the reuse.
name: register-table-full
filename: reg.txt
backend: tmux
dimensions: [24, 80]
initial: |-
  target
  filler
keys:
  - C-x
  - r
  - SPC
  - a
