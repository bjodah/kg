# A spawned process's `directory` (src/process.h's kg_spawn_request field)
# defaults to NULL, meaning "inherit kg's own directory" -- start-process
# does not expose a directory argument of its own (not in the sub-plan's
# natives table), so this pins that default rather than a caller-chosen
# directory.  The tmux backend runs kg with the test runner's own cwd (the
# repo root), unlike the pexpect backend's isolated temp directory, so the
# proof reads a file that is only there because of the repo -- Makefile's
# first line -- through a relative path the child can only resolve if it
# started in that same directory.
name: lisp-process-cwd
filename: cwd.txt
requires_feature: lisp
backend: tmux
dimensions: [24, 80]
key_delay: 0.3
initial: "marker\n"
keys:
  - M-x
  - eval-expression
  - RET
  # head(1) is /usr/bin/head on FreeBSD and /bin/head on Linux, so the
  # program is /usr/bin/env -- which is at that path on both -- and head is
  # found on PATH.  The child is still exec'd directly (one exec of env,
  # which execs head): nothing here goes through a shell, and the relative
  # "Makefile" is still resolved by the child, which is the property under
  # test.
  - (start-process "e" (current-buffer) "/usr/bin/env" "head" "-n1" "Makefile")
  - RET
  # Process output reaches the buffer only at a safe-point drain, and a
  # keypress is what reaches one.  These are C-e (end-of-line: idempotent,
  # edits nothing) purely to give the drain chances to run, so the count is
  # a synchronisation budget rather than anything about the behaviour under
  # test.  Five was not enough: under valgrind, with the parallel runner's
  # other lanes competing, the child had not been reaped and drained inside
  # the ~0.8 s that bought, and the valgrind lane failed with the process line missing
  # while the same case passed 10/10 run on its own.  Fifteen was not
  # enough either: the Phase 12 fix cycle's final 12-lane run lost the
  # process line in the valgrind lane once more (442/443, this case alone), with
  # the standalone re-run green -- so the budget doubled again.  Thirty
  # keys at 0.15 s ALSO lost the line once in a 12-lane run (again this
  # case alone, again standalone green), so the third widening doubles
  # key_delay to 0.3 s instead of the key count: what the child needs
  # under load is wall time, each key already buys one drain chance,
  # and slower keys double the ~4.5 s window to ~9 s without feeding
  # the pane-settle detector more repaint events.  Size this against
  # the slowest lane UNDER LOAD, not against a quiet box.
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
  - C-e
expected_saved: |
  marker
  # Makefile for kg editor
