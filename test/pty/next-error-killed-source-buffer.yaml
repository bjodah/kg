# Killing the buffer next-error last visited invalidates its source
# marker (a buffer handle's generation moves on kill, so the marker
# resolves as gone rather than into whatever the freed slot picks up
# next -- opening another file is what exercises that "reused storage"
# case, not just an inactive slot).  Revisiting the same diagnostic must
# reopen the file fresh by path and land at the diagnostic's own
# line/column, not jump into the unrelated buffer that took the slot.
#
# The `C-a` run after the compile command is cover, not editing.  A
# compile is asynchronous and nothing in the harness waits for it: the
# child has to run and its output be read and parsed before `M-g n` (or
# `M-g p`) has anything to navigate to, and the only cover is the
# key_delays slept in between.  Two of them -- 0.3 s at the 0.15 this
# family carried -- is not enough under load: three separate cases of this
# family failed the ci-15 valgrind lane of six-lane parallel runs, each
# with the navigation simply not having happened, and the mechanism
# reproduces on demand at a smaller key_delay under valgrind with the box
# loaded.  Ten sleeps at 0.2 is 2.0 s, and `C-a` is a no-op for what
# follows: next-error jumps to the diagnostic's own location regardless of
# where point was.
name: next-error-killed-source-buffer
filename: target.c
backend: tmux
dimensions: [24, 80]
key_delay: 0.2
config_files:
  other.txt: |
    other
initial: |-
  one
  two
  three
keys:
  - M-x
  - compile
  - RET
  - C-a
  - C-k
  - "printf 'target.c:2:1: error: e\\n'"
  - RET
  - C-a
  - C-a
  - C-a
  - C-a
  - C-a
  - C-a
  - C-a
  - C-a
  - M-g
  - n
  - C-x
  - k
  - C-x
  - C-f
  - "~/other.txt"
  - RET
  - M-g
  - n
  - X
expected_saved: |-
  one
  Xtwo
  three
