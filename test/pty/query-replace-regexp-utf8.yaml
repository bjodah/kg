# "." consumes a whole character, so replacing it takes both bytes of
# "å" rather than leaving a stray 0xa5 continuation byte behind in the
# saved file.  The engine gets this right on its own now; the wrapper's
# glyph snapping stays as defence in depth.
name: query-replace-regexp-utf8
filename: replace_regexp_utf8.txt
backend: pexpect
startup_delay: 1.0
key_delay: 0.2
initial: |
  åbc
keys:
  - M-x
  - query-replace-regexp
  - ENTER
  - '.'
  - ENTER
  - 'X'
  - ENTER
  - '!'
expected_saved: |
  XXX
