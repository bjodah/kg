# `C-u 3 x` inserts three characters as one edit transaction, recorded as one
# undo step through the edit gateway, matching Emacs.  Undoing it with C-_
# removes all three characters in one step.
name: insert-repeated-literal-undo
filename: insert-repeated-literal-undo.txt
initial: "ab"
keys:
  - C-u
  - "3"
  - x
  - C-_
  - C-_
expected_saved: "ab"
