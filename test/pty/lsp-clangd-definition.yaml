name: lsp-clangd-definition
# M-. against the real clangd, not the fake server: no `env:` here, so kg
# spawns the `clangd` on PATH exactly as a user would get it, and
# `requires_tool: clangd` makes a box without one SKIP with a printed
# reason instead of failing (`--require-tools` turns that into an upfront
# FAIL, same as tmux and the Emacs oracle).
#
# The fixture is a two-file project rather than a lone .c file because that
# is what makes the workspace root real: `workspace_files:` plants header.h
# and a compile_commands.json beside the file under test, so
# lsp_workspace_root() finds the compilation database in the case's own
# temporary directory and clangd is started there with a command line for
# main.c that it agrees with.  The database's "directory" is the one field
# clangd will not take relative, and the directory is a fresh mkdtemp, so
# the value is written `{CWD}` and expanded when the run stages it.
#
# The jump asserted here is within main.c, because the assertion is the
# saved file and kg saves the buffer it is in: a jump into header.h would
# save header.h while the harness reads main.c.  The cross-file jump is
# test/pty/lsp-clangd-definition-header.yaml, which reads the screen
# instead.
#
# The two non-ASCII characters are the encoding proof.  kg offers utf-8
# first and clangd 15+ honours positionEncoding, so both the character kg
# sends and the one it decodes are UTF-8 *byte* offsets into the line.  The
# "ä" sits before the reference on line 3 and the "ö" before the definition
# on line 2, which is what makes a byte offset differ from a codepoint one:
# a kg that counted codepoints would ask clangd about the byte before
# "local_target" and land the answer a byte early, and both directions of
# that mistake move the X.
#
# Point is walked to the reference rather than searched to it: four M-f
# ("int", "use", "void", "return") and one C-f put it on the "l" of
# local_target, and an identifier's first byte is a position clangd
# resolves without argument.  M-f alone would stop *after* the identifier
# ("_" is a word constituent here), which is the "(" as far as the server
# is concerned.
#
# One M-. -- and it is a cold server, which is the whole point.  The
# command starts clangd and asks its question in the same keystroke, so the
# request is built while the client is still INITIALIZING and nobody has
# told kg yet that clangd wanted utf-8 rather than the protocol's UTF-16
# default.  On the "ä" line those two disagree by one, so a request encoded
# at call time asks about the byte before the identifier and is answered
# "No definition found".  lsp_client_request_deferred() is what makes this
# case pass: the params are built when the message is finally written,
# after the handshake settled the encoding.  A second M-. would hide the
# bug rather than test it, which is what this case did until the fix.
requires_feature: lsp
requires_tool: clangd
backend: pexpect
# clangd is a real compiler front end: the first request pays for process
# start, the initialize handshake and one parse of the TU.  Measured by
# hand on this box it answered in ~25 ms, but a loaded CI box is not this
# box, so the wait after M-. is six idle repaints.
key_delay: 0.3
filename: main.c
workspace_files:
  header.h: |
    #ifndef HEADER_H
    #define HEADER_H
    /* only-in-header-marker */
    static int header_target(int v) { return v + 1; }
    #endif
  compile_commands.json: |
    [
      {
        "directory": "{CWD}",
        "file": "{CWD}/main.c",
        "arguments": ["cc", "-c", "{CWD}/main.c"]
      }
    ]
initial: |
  #include "header.h"
  /* ö */ static int local_target(int v) { return v + 2; }
  /* ä */ int use(void) { return local_target(1) + header_target(2); }
keys:
  - "Down"
  - "Down"
  - "M-f"
  - "M-f"
  - "M-f"
  - "M-f"
  - "C-f"
  - "M-."
  - "C-l"
  - "C-l"
  - "C-l"
  - "C-l"
  - "C-l"
  - "C-l"
  - "X"
expected_saved: |
  #include "header.h"
  /* ö */ static int Xlocal_target(int v) { return v + 2; }
  /* ä */ int use(void) { return local_target(1) + header_target(2); }
