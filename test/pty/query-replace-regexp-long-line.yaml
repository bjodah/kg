# A few thousand replacements on one line: each is a single memmove and a
# single row rebuild now, where the byte-at-a-time loops rebuilt the row
# (render and highlight included) once per byte.  The first pass halves
# 4000 "a"s into 2000 "b"s, the second collapses them, so the expectation
# stays small while the work does not.
name: query-replace-regexp-long-line
filename: long-line.txt
backend: pexpect
startup_delay: 1.0
key_delay: 0.2
initial: "\n"
keys:
  - M-x
  - query-replace-regexp
  - ENTER
  - 'a\{2\}'
  - ENTER
  - 'b'
  - ENTER
  - '!'
  - C-Home
  - M-x
  - query-replace-regexp
  - ENTER
  - 'b+'
  - ENTER
  - 'X'
  - ENTER
  - '!'
expected_saved: "X\n"
