name: lsp-rename-all-or-nothing
# A rename that cannot be made everywhere is made nowhere.
#
# The server names two files: the document the client opened, and a
# sibling that does not exist.  kg checks every file of a WorkspaceEdit --
# it opens, it is writable, its ranges are inside it -- before it writes
# one byte, so the missing file refuses the whole edit and the file the
# user is looking at is left exactly as it was.  Half a rename is the one
# outcome worse than none: the occurrences that were renamed no longer
# match the ones that were not, and only the user can tell which is which.
#
# The screen assertion is the other half of the property.  A refusal that
# does not name the file is a refusal the user cannot act on, and the
# report that used to be printed over it ("Renamed 1 occurrence in 1
# file") was worse than silence -- it was wrong.
requires_feature: lsp
backend: tmux
key_delay: 0.35
env:
  KG_LSP_SERVER_C: "python3 {REPO}/test/fake_lsp_server.py --mode protocol --rename-self 0:4:10 --rename-self 1:23:29 --rename-sibling gone.c:0:0:3"
filename: renmulti.c
initial: |
  int target(void) { return 1; }
  int use(void) { return target(); }
keys:
  - "M-x"
  - "lsp-rename"
  - RET
  - "renamed"
  - RET
  - "C-l"
  - "C-l"
  - "C-l"
  - "C-l"
expected_saved: |
  int target(void) { return 1; }
  int use(void) { return target(); }
expected_screen_contains:
  - "gone.c"
expected_screen_not_contains:
  - "Renamed"
