# Sub-plan 09D Part 3, 09A Table X's second kg row: mid-hook exhaustion
# reports and the host operation completes.
#
# `before-save-hook` runs a function that exhausts the arena into a `let`
# local.  Both halves are asserted here, and they are the whole row:
#
#   * the host operation completes -- the file holds what was typed, saved
#     by a save whose hook had just run the arena out.  The hook seam
#     (src/lisp_hooks.c's guarded run) contains the completion instead of
#     letting it unwind through the editor.
#   * it is reported, not swallowed -- `Hook error (before-save-hook): out
#     of memory` is what the echo area is left showing.  Measured: the
#     hook's diagnostic lands after the save's own "Wrote ..." message, so
#     it is the surviving one.
#
# The exhaustion's other trace, `fails 1` in the arena counters, is pinned
# by lisp-exhaustion-mid-command-recovers; there is one echo area, so a
# case cannot read both the message and the diagnostics command's line.
#
# This case is not pin-sensitive, by design and measured: it PASSes
# unchanged against a kg built on the pre-Phase-9 fe (acc94f7).  09A
# Table X pins behaviour that already existed -- the hook seam contains
# the completion and reports it, and 09B changed the condition *object*
# behind the message, not the message.  The case in this set that does
# fail on that fe is lisp-exhaustion-caught-by-name, which is where the
# by-name catch is asserted.
#
# No Emacs oracle: Emacs has no arena, no hook seam of this shape, and no
# out-of-memory a Lisp program can reach on purpose.
name: lisp-exhaustion-mid-hook-reports
filename: lisp-exhaustion-hook.txt
requires_feature: lisp
# The arena is pinned to 1 MiB rather than inherited, and that is a
# property of the arena and the STEP BUDGET together, not a preference:
# a fill loop costs about 10.7 steps per cons, so KG_LISP_STEP_LIMIT's
# 2^20 steps buy roughly 97000 of them and any arena with more slots than
# that raises the uncatchable step-limit wall before it ever raises
# arena-exhaustion.  Measured at the compiled 10 MiB default (440103
# slots): `evaluation step limit exceeded', peak-live 97449.  So this case
# holds the conditions it was written against -- 41971 slots -- the way
# utils/check_lisp_gc_stress.py holds its own; Phase B of
# doc/plans/2026-08-19-fe-simplification-and-cheap-compat.md is the knob
# that makes that possible.
env:
  KG_LISP_ARENA_BYTES: "1M"
backend: tmux
dimensions: [24, 120]
# This case is the one in the set with the least natural cover, and it was
# measured failing without this line: the assertion is on a message kg
# paints *after* the last key, the harness captures the pane once it has
# been quiet for 50 ms, and a kg busy filling 41971 object slots inside a
# hook is quiet.  At the default 0.05 it failed in the gcc/valgrind, ASan
# and MSan lanes of a six-lane parallel run (0.9-2.9 s per attempt) while
# passing three times out of three on its own.
#
# Both the cover and its price are measured.  From the last key to the
# diagnostic being painted, three runs per build:
#
#   plain gcc -Os          0.003 s
#   valgrind               0.240 s
#   clang MSan -O0         0.96  s   (ci-05's build)
#   clang MSan, 24 busy    1.35-1.79 s
#
# MSan is what this has to be sized against -- it is the lane the case has
# actually failed in -- so the target is ~2.5 s of cover, not the ~0.5 s
# the plain and valgrind numbers alone would suggest.
#
# key_delay is slept after *every* key the harness sends: this case's own
# plus DEFAULT_TRAILER's four (C-x C-s C-x C-c).  A `key_delay` of 2.0 on
# three keys, which is what this case carried, therefore bought 2.05 s of
# cover for 14.3 s of wall time (measured; the comment claimed "near
# 6 s"), and made this the slowest case in the suite.  The three `Down`
# keys below buy the same cover from four sleeps instead of one, so 0.6
# gives 2.4 s of it for 6.5 s total.  They are a deliberate no-op: a
# single-line buffer, so point does not move, the buffer is not modified
# and the echo area is not written -- all they do is keep the harness
# sleeping while kg finishes the fill.
#
# Verified at this size, three runs out of three each: PASS under MSan
# idle, and PASS under MSan with 24 busy loops on this 32-core box.
key_delay: 0.6
config_files:
  .config/kg/init.el: |
    ;;; init.el --- a before-save-hook that runs the arena out.
    (defun exhaust-before-save ()
      (let ((l nil))
        (while t (setq l (cons 1 l)))))
    (add-hook 'before-save-hook 'exhaust-before-save)
initial: ""
keys:
  - s
  - C-x
  - C-s
  # Cover, not editing: see the key_delay comment above.
  - Down
  - Down
  - Down
expected_saved: s
expected_screen_contains:
  - "Hook error (before-save-hook): out of memory"
expected_screen_not_contains:
  - "Lisp not available"
