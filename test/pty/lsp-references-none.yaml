name: lsp-references-none
# A server that finds nothing gets no buffer.  The fake server is started
# with neither --references-self nor --reference, so it answers
# `textDocument/references` with an empty array: the echo area says "No
# references found" and no *xref* buffer is opened.
#
# The assertion is in two halves.  The X lands at point, where it was
# before M-? -- nothing was selected, nothing was visited, and the
# read-only listing that would have swallowed the keystroke is not there.
# And the echo area says "No references found", which is what makes this a
# tmux case: point staying put is equally true of a kg that never managed
# to ask anything, and this case used to pass against /bin/false on
# exactly that account.
requires_feature: lsp
backend: tmux
key_delay: 0.35
env:
  KG_LSP_SERVER_C: "python3 {REPO}/test/fake_lsp_server.py --mode protocol"
filename: xrefref.c
initial: |
  int target(void) { return 1; }
  int other(void) { return 2; }
  int use(void) { return target(); }
keys:
  - "M-?"
  - "C-l"
  - "C-l"
  - "C-l"
trailer_keys:
  - "X"
  - "C-x"
  - "C-s"
  - "C-x"
  - "C-c"
expected_saved: |
  Xint target(void) { return 1; }
  int other(void) { return 2; }
  int use(void) { return target(); }
expected_screen_contains:
  - "No references found"
