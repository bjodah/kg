variables:
  - &ci_image 'cont-reg.bjodah.se:443/bjodah/triceratops-9:11'

when:
  - event: [push]

steps:
  - name: build-and-test
    image: *ci_image
    privileged: true
    environment:
      # Hosted CI runs everything, including the expensive steps a local
      # run-ci-steps.sh skips (the suite under valgrind).
      CI_EXPENSIVE: "1"
    commands:
      - bash -lc 'source $(compgen -G /opt-3/cpython-*-apt-deb/bin/activate) && .ci/run-ci-steps.sh'
