# Combining marks are drawn on top of the preceding glyph, so they take no
# display column of their own.  On "éz" spelled as e + U+0301 COMBINING
# ACUTE + z, Emacs reports (1,2) at C-e; kg said (1,3) while every
# non-continuation byte counted as one column.
name: modeline-column-combining-mark
filename: col-combining.txt
backend: tmux
dimensions: [12, 44]
initial: "éz\n"
keys:
  - C-e
expected_saved: "éz\n"
expected_screen_contains:
  - "col-combining.txt  All (1,2)"
expected_screen_not_contains:
  - "(1,3)"
