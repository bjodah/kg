name: lsp-gopls-definition
# M-. against the real gopls, not the fake server: no `env:` here, so kg
# spawns the `gopls` on PATH exactly as a user would get it, and
# `requires_tool: gopls` makes a box without one SKIP with a printed reason
# (`--require-tools` turns that into an upfront FAIL).
#
# The fixture is what makes the workspace root real: `workspace_files:`
# plants a go.mod beside the file under test, which is the marker
# lsp_workspace_root() looks for, so gopls is started in the case's own
# temporary directory and the module it loads there is the one holding the
# file kg asks about.  A .go file under no module at all is what gopls calls
# "standalone", and it answers far less about one.
#
# The jump asserted here is within main.go, because the assertion is the
# saved file and kg saves the buffer it is in.
#
# Point is walked to the reference rather than searched to it: seven Down
# and eight C-f put it on the "l" of the indented `localTarget(1)` -- the
# eight are the leading TAB, "return" and the space after it -- and an
# identifier's first byte is a position gopls resolves without argument.
#
# The M-. is asked REPEATEDLY for the reason lsp-rust-analyzer-definition
# .yaml explains at length: servers start lazily, so the first M-. is what
# spawns gopls, and a Go module has to be loaded before any position in it
# resolves -- the first request is answered from whatever the server knows
# so far, rather than held until it knows more.  So the question is asked
# again rather than waited on longer: five rounds of M-. followed by
# `SETTLE=<budget>:(5,5)`, budgets escalating 4, 4, 8, 16, 32.  A SETTLE is
# a budget and not a sleep -- the harness polls the pane until the mode
# line reads the definition's position, which is on screen only once the
# answer has been applied, the mode line reading `(8,8)` until then -- so
# the round that lands ends its wait immediately, every later round is free
# (its SETTLE sees `(5,5)` already there, and re-asking at the declaration
# point returns that same location), and only the rounds that ask too early
# cost their budget.  The escalation keeps a fast box cheap while still
# covering one that needs a minute: the last round is asked at t=32 s and
# waits until t=64 s.
#
# What this replaced was 24 repaints (7.2 s) for the load and 10 (3.0 s)
# for the answer -- a fixed sleep sized on the development box, which is
# the shape that failed on the CI box for the sibling servers.  Reading a
# pane needs one to read, which is why this case is `backend: tmux` (a box
# without tmux SKIPs it, the same way a box without gopls does) and why it
# no longer carries a key_delay: the delay used to BE the wait.
requires_feature: lsp
requires_tool: gopls
backend: tmux
filename: main.go
workspace_files:
  go.mod: |
    module example.com/fixture

    go 1.22
initial: |
  package main

  import "fmt"

  func localTarget(v int) int { return v + 2 }

  func useIt() int {
  	return localTarget(1)
  }

  func main() {
  	fmt.Println(useIt())
  }
keys:
  - "Down"
  - "Down"
  - "Down"
  - "Down"
  - "Down"
  - "Down"
  - "Down"
  - "C-f"
  - "C-f"
  - "C-f"
  - "C-f"
  - "C-f"
  - "C-f"
  - "C-f"
  - "C-f"
  - "M-."
  - "SETTLE=4:(5,5)"
  - "M-."
  - "SETTLE=4:(5,5)"
  - "M-."
  - "SETTLE=8:(5,5)"
  - "M-."
  - "SETTLE=16:(5,5)"
  - "M-."
  - "SETTLE=32:(5,5)"
  - "X"
expected_saved: |
  package main

  import "fmt"

  func XlocalTarget(v int) int { return v + 2 }

  func useIt() int {
  	return localTarget(1)
  }

  func main() {
  	fmt.Println(useIt())
  }
