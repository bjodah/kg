# A pattern the engine gives up on is not a pattern that failed to match.
# "\(a*\)*b" over a run of "a"s is the classic catastrophic-backtracking
# shape and exhausts tiny-regex-c's step budget well before thirty of
# them.  The wrapper used to fold that into "no match", so isearch walked
# on to the next line and matched there -- silently answering a question
# it had not been able to ask.  It now stops on the line it gave up on,
# leaving point where it was, and says "[too complex]" in its prompt.
#
# Point is what this case can see: the prompt itself needs a screen
# capture, and under the sanitizer and valgrind lanes two million matcher
# steps outlast the capture.
name: isearch-regexp-too-complex
filename: too-complex.txt
backend: pexpect
startup_delay: 1.0
key_delay: 0.2
initial: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\naab\n"
keys:
  - M-x
  - isearch-forward-regexp
  - RET
  - '\(a*\)*b'
  - C-a
  - X
expected_saved: "Xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\naab\n"
