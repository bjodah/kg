# A read-only buffer refuses every editing key, whichever key reaches the
# command.
#
# It did not always: C-o, M-d, M-^, M-q, M-u, M-l, M-c and M-; were not on
# kbd.c's readonly_blocked_keys[] and their handlers do not check, so they
# edited a buffer that refuses edits.  Phase 4 of plan 01 settles that by
# making each of them a command with CMD_EDITS_BUFFER, which cmd_invoke()
# refuses in one place for every route: key, M-x and Lisp alike.  The case
# was checked in xfail and turned green when the last of them moved.
#
# The keys are pressed on line 2 with point after "se", where each one
# would leave a visible mark: C-o splits the line, M-d kills "cond", M-^
# joins the two lines, M-q refills the paragraph, M-u/M-l/M-c change the
# case of "cond", and M-; comments the line out (the file is .c so the
# mode has a comment syntax to use).
name: read-only-refuses-editing-keys
filename: read-only-keys.c
backend: pexpect
key_delay: 0.08
initial: "hello world\nsecond line\n"
keys:
  - C-x
  - C-q
  - C-n
  - C-f
  - C-f
  - C-o
  - M-d
  - "M-^"
  - M-q
  - M-u
  - M-l
  - M-c
  - "M-;"
  - C-x
  - C-q
expected_saved: "hello world\nsecond line\n"
