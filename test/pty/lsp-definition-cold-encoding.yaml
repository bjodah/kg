name: lsp-definition-cold-encoding
# The regression case for a request built before the handshake settled --
# the one real clangd found (test/pty/lsp-clangd-definition.yaml), written
# so it runs on a box with no language server at all.
#
# M-. on a cold server does two things in one keystroke: it starts the
# server and it asks a question.  Until src/lsp_client.c grew
# lsp_client_request_deferred(), the question was encoded there and then,
# with `lsp_client_caps()` still answering the pre-handshake default
# (UTF-16) rather than the utf-8 this server -- like every real one kg
# ships a spec for -- is about to negotiate.  On a line with a multi-byte
# character before point those two disagree by one unit per character, so
# the server was asked about the wrong column.
#
# `--definition-echo` is what makes that visible without a real server: it
# answers with a Location at exactly the position it was asked about.  So
# the answer is kg's own question handed back, and the jump is a round trip
# -- encode with the negotiated encoding, decode with it again -- which
# lands point where it already was.  Only then does the X go where this
# case says.
#
# Point starts at (1,1) and reaches the end of "int" on line 3 with two
# Downs and one M-f: byte 12 of `/* ä */ int use(void) ...`, which is UTF-16
# unit 11 because of the "ä".  A kg that encoded 11 and decoded it as a byte
# offset would put the X inside "int" instead of after it, which is the
# whole difference this case exists to see.
requires_feature: lsp
backend: pexpect
key_delay: 0.35
env:
  KG_LSP_SERVER_C: "python3 {REPO}/test/fake_lsp_server.py --mode protocol --position-encoding utf-8 --definition-echo"
filename: xrefcold.c
initial: |
  int target(void) { return 1; }
  int other(void) { return 2; }
  /* ä */ int use(void) { return target(); }
keys:
  - "Down"
  - "Down"
  - "M-f"
  - "M-."
  - "C-l"
  - "C-l"
  - "X"
expected_saved: |
  int target(void) { return 1; }
  int other(void) { return 2; }
  /* ä */ intX use(void) { return target(); }
