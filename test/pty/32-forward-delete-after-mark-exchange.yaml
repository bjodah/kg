# Deleting the byte immediately before a mark relocates the mark to BOB.
# The later exchange and paragraph mark therefore leave C-d covering the
# leading newline, which joins the two rows.  This used to preserve the blank
# row while marks were stale row/column snapshots.
name: forward-delete-after-mark-exchange
filename: forward-delete-after-mark-exchange.txt
initial: "a\nbbbb"
keys:
  - C-f
  - C-SPC
  - C-a
  - C-d
  - C-x
  - C-x
  - ESC
  - C-h
  - C-d
expected_saved: "bbbb"
