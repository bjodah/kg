# End-to-end extension-package proof: init.el loads a package that
# defines an interactive command and binds it; the bound key and M-x both
# run it.
name: lisp-bind-key
filename: lisp-bindkey.txt
requires_feature: lisp
config_files:
  .config/kg/init.el: '(load "hi-pkg")'
  .config/kg/lisp/hi-pkg.el: |
    (defun insert-hi () (interactive) (insert "hi"))
    (global-set-key "C-c i" "insert-hi")
initial: ""
keys:
  - C-c
  - i
  - M-x
  - insert-hi
  - RET
expected_saved: hihi
